<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport"
        content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">

  <title>KEYZO Engine</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      font-family: Arial, Helvetica, sans-serif;
    }

    body {
      background:
        radial-gradient(
          circle at 50% 12%,
          rgba(75, 55, 180, 0.75) 0%,
          rgba(35, 32, 105, 0.85) 30%,
          rgba(9, 25, 48, 1) 78%
        );

      color: white;
    }

    .splash {
      width: 100%;
      height: 100dvh;
      min-height: 100vh;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      position: relative;
      overflow: hidden;

      background:
        radial-gradient(
          circle at 50% 20%,
          rgba(86, 65, 210, 0.28),
          transparent 45%
        ),
        linear-gradient(
          180deg,
          #2a2675 0%,
          #15194b 48%,
          #07192d 100%
        );
    }

    .glow {
      position: absolute;
      width: 520px;
      height: 520px;
      border-radius: 50%;

      background: rgba(92, 68, 255, 0.12);
      filter: blur(90px);

      top: -120px;
      left: 50%;
      transform: translateX(-50%);
    }

    .content {
      position: relative;
      z-index: 2;

      width: 100%;
      max-width: 500px;

      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;

      padding: 20px;
      text-align: center;
    }

    .character {
      width: min(72vw, 380px);
      max-height: 430px;

      object-fit: contain;

      filter:
        drop-shadow(0 20px 30px rgba(0,0,0,0.45))
        drop-shadow(0 0 25px rgba(180, 70, 255, 0.15));

      animation: float 3.5s ease-in-out infinite;
    }

    .character-fallback {
      display: none;

      font-size: 170px;
      line-height: 1;

      filter:
        drop-shadow(0 20px 30px rgba(0,0,0,.5));
    }

    .brand {
      margin-top: 18px;

      font-size: clamp(58px, 15vw, 96px);
      font-weight: 700;
      letter-spacing: 0.22em;

      margin-left: 0.22em;

      color: #ffffff;

      text-shadow:
        0 5px 20px rgba(0,0,0,.45),
        0 0 30px rgba(130, 90, 255, .18);
    }

    .engine {
      margin-top: 8px;

      font-size: clamp(22px, 5vw, 34px);
      font-weight: 600;

      letter-spacing: 0.55em;
      margin-left: 0.55em;

      color: #a7acd3;
    }

    .version {
      position: absolute;

      bottom: 35px;
      left: 0;
      right: 0;

      text-align: center;

      color: #969dc5;
      font-size: 17px;
      letter-spacing: .03em;

      z-index: 3;
    }

    @keyframes float {
      0%, 100% {
        transform: translateY(0);
      }

      50% {
        transform: translateY(-12px);
      }
    }

    @media (max-height: 700px) {
      .character {
        width: 260px;
        max-height: 300px;
      }

      .brand {
        font-size: 58px;
        margin-top: 5px;
      }

      .engine {
        font-size: 20px;
      }

      .version {
        bottom: 20px;
      }
    }

    @media (max-width: 380px) {
      .character {
        width: 250px;
      }

      .brand {
        font-size: 52px;
      }

      .engine {
        font-size: 18px;
      }
    }
  </style>
</head>

<body>

  <main class="splash">

    <div class="glow"></div>

    <section class="content">

      <!--
        Letakkan karakter KEYZO di:
        assets/keyzo.png
      -->
      <img
        src="/assets/keyzo.png"
        alt="KEYZO"
        class="character"
        id="character"
      >

      <!-- Fallback kalau gambar belum ada -->
      <div class="character-fallback" id="fallback">
        🥷
      </div>

      <h1 class="brand">KEYZO</h1>

      <div class="engine">
        ENGINE
      </div>

    </section>

    <footer class="version">
      v2.1.4 &nbsp; © KEYZO
    </footer>

  </main>

  <script>
    const character = document.getElementById("character");
    const fallback = document.getElementById("fallback");

    character.addEventListener("error", () => {
      character.style.display = "none";
      fallback.style.display = "block";
    });

    /*
      Setelah splash selesai,
      nanti bisa diarahkan ke halaman login.
      
      Untuk sekarang tidak otomatis pindah,
      supaya tampilan depan bisa dilihat dulu.
    */
  </script>

</body>
</html>
