<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIBoss Login</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
    }

    .login-box {
      width: 90%;
      max-width: 400px;
      padding: 30px;
      background: #1f2937;
      border-radius: 15px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.3);
    }

    h1 {
      text-align: center;
      color: white;
      margin-bottom: 25px;
    }

    input {
      width: 100%;
      padding: 14px;
      margin-bottom: 15px;
      border: none;
      border-radius: 8px;
      background: #374151;
      color: white;
      outline: none;
    }

    input::placeholder {
      color: #9ca3af;
    }

    button {
      width: 100%;
      padding: 14px;
      border: none;
      border-radius: 8px;
      background: #6366f1;
      color: white;
      font-size: 16px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4f46e5;
    }

    #result {
      margin-top: 20px;
      text-align: center;
      color: white;
    }
  </style>
</head>

<body>

  <div class="login-box">
    <h1>KIBoss Login</h1>

    <form id="loginForm">
      <input
        type="text"
        id="username"
        placeholder="Username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        required
      >

      <button type="submit">Login</button>
    </form>

    <div id="result"></div>
  </div>

  <script>
    const form = document.getElementById("loginForm");
    const result = document.getElementById("result");

    form.addEventListener("submit", async function(e) {
      e.preventDefault();

      const username = document.getElementById("username").value;
      const password = document.getElementById("password").value;

      result.textContent = "Memproses...";

      try {
        const response = await fetch(
          "https://kibo-boss.vercel.app/api/login",
          {
            method: "POST",
            headers: {
              "Content-Type": "application/json"
            },
            body: JSON.stringify({
              username: username,
              password: password
            })
          }
        );

        const data = await response.json();

        if (data.success) {
          result.textContent = "Login berhasil!";
        } else {
          result.textContent = data.message || "Login gagal";
        }

      } catch (error) {
        result.textContent = "Terjadi kesalahan koneksi";
        console.error(error);
      }
    });
  </script>

</body>
</html>
