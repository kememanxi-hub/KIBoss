<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>KEYZO</title>

  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
    }

    html,
    body {
      width: 100%;
      min-height: 100%;
      font-family: Arial, Helvetica, sans-serif;
      background:
        radial-gradient(
          circle at top,
          #4430b8 0%,
          #211b6d 35%,
          #07182e 100%
        );
      color: white;
    }

    body {
      min-height: 100vh;
      overflow-x: hidden;
    }

    .page {
      min-height: 100vh;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 30px 20px;
    }

    .hidden {
      display: none !important;
    }

    /* =========================
       SPLASH
    ========================= */

    #splashPage {
      text-align: center;
      animation: fadeIn 0.8s ease;
    }

    .ninja {
      font-size: 150px;
      line-height: 1;
      margin-bottom: 25px;
      filter: drop-shadow(0 10px 25px rgba(0,0,0,0.35));
    }

    .brand {
      font-size: 76px;
      font-weight: 700;
      letter-spacing: 14px;
      margin-left: 14px;
    }

    .engine {
      margin-top: 18px;
      font-size: 32px;
      letter-spacing: 14px;
      color: #aeb5d6;
      margin-left: 14px;
    }

    .main-button {
      width: min(680px, 90vw);
      height: 90px;
      margin-top: 55px;
      border: none;
      border-radius: 25px;
      background: linear-gradient(
        135deg,
        #6555ff,
        #4935e8
      );
      color: white;
      font-size: 32px;
      font-weight: 500;
      cursor: pointer;
      box-shadow:
        0 15px 35px rgba(54, 36, 220, 0.35);
      transition: transform 0.2s ease, filter 0.2s ease;
    }

    .main-button:hover {
      transform: translateY(-3px);
      filter: brightness(1.08);
    }

    .main-button:active {
      transform: scale(0.98);
    }

    .footer {
      position: absolute;
      bottom: 35px;
      font-size: 28px;
      color: #9da7ca;
    }

    /* =========================
       LOGIN
    ========================= */

    .login-card,
    .dashboard-card {
      width: min(760px, 92vw);
      padding: 65px 55px;
      border-radius: 38px;
      background: rgba(29, 43, 64, 0.94);
      box-shadow:
        0 25px 60px rgba(0, 0, 0, 0.35);
      text-align: center;
      animation: slideUp 0.45s ease;
    }

    .login-title {
      font-size: 68px;
      font-weight: 600;
      margin-bottom: 18px;
    }

    .login-subtitle {
      font-size: 32px;
      color: #aab4d2;
      margin-bottom: 55px;
    }

    .input {
      width: 100%;
      height: 100px;
      margin-bottom: 28px;
      padding: 0 28px;
      border-radius: 25px;
      border: 3px solid #465675;
      outline: none;
      background: #0e172c;
      color: white;
      font-size: 29px;
      transition: border-color 0.2s ease,
                  box-shadow 0.2s ease;
    }

    .input:focus {
      border-color: #6555ff;
      box-shadow: 0 0 0 5px rgba(101, 85, 255, 0.18);
    }

    .input::placeholder {
      color: #8993ad;
    }

    .login-button,
    .logout-button {
      width: 100%;
      height: 95px;
      border: none;
      border-radius: 25px;
      background: linear-gradient(
        135deg,
        #6555ff,
        #4935e8
      );
      color: white;
      font-size: 31px;
      cursor: pointer;
      transition: transform 0.2s ease,
                  filter 0.2s ease;
    }

    .login-button:hover,
    .logout-button:hover {
      transform: translateY(-2px);
      filter: brightness(1.08);
    }

    .login-button:disabled {
      opacity: 0.6;
      cursor: wait;
    }

    .message {
      min-height: 40px;
      margin-top: 28px;
      font-size: 24px;
      color: #ff9ca7;
    }

    .back-button {
      margin-top: 35px;
      border: none;
      background: transparent;
      color: #aab4d2;
      font-size: 27px;
      cursor: pointer;
    }

    /* =========================
       DASHBOARD
    ========================= */

    .dashboard-title {
      font-size: 68px;
      margin-bottom: 35px;
    }

    .welcome {
      font-size: 40px;
      margin-bottom: 25px;
    }

    .dashboard-text {
      font-size: 30px;
      line-height: 1.5;
      color: #d2d8e8;
      margin-bottom: 55px;
    }

    .profile-box {
      margin-bottom: 40px;
      padding: 25px;
      border-radius: 22px;
      background: rgba(10, 20, 40, 0.55);
      color: #bfc8df;
      font-size: 25px;
    }

    /* =========================
       ANIMATION
    ========================= */

    @keyframes fadeIn {
      from {
        opacity: 0;
        transform: scale(0.97);
      }

      to {
        opacity: 1;
        transform: scale(1);
      }
    }

    @keyframes slideUp {
      from {
        opacity: 0;
        transform: translateY(25px);
      }

      to {
        opacity: 1;
        transform: translateY(0);
      }
    }

    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 600px) {

      .page {
        padding: 25px 16px;
      }

      .ninja {
        font-size: 110px;
      }

      .brand {
        font-size: 52px;
        letter-spacing: 9px;
        margin-left: 9px;
      }

      .engine {
        font-size: 23px;
        letter-spacing: 9px;
        margin-left: 9px;
      }

      .main-button {
        height: 78px;
        font-size: 27px;
        border-radius: 21px;
        margin-top: 42px;
      }

      .footer {
        bottom: 25px;
        font-size: 21px;
      }

      .login-card,
      .dashboard-card {
        padding: 45px 28px;
        border-radius: 32px;
      }

      .login-title,
      .dashboard-title {
        font-size: 48px;
      }

      .login-subtitle {
        font-size: 25px;
        margin-bottom: 38px;
      }

      .input {
        height: 82px;
        font-size: 23px;
        margin-bottom: 22px;
      }

      .login-button,
      .logout-button {
        height: 82px;
        font-size: 27px;
      }

      .message {
        font-size: 19px;
      }

      .welcome {
        font-size: 29px;
      }

      .dashboard-text {
        font-size: 22px;
      }

      .profile-box {
        font-size: 19px;
      }
    }
  </style>
</head>

<body>

  <!-- =========================
       SPLASH PAGE
  ========================== -->

  <section id="splashPage" class="page">

    <div class="ninja">🥷</div>

    <div class="brand">
      KEYZO
    </div>

    <div class="engine">
      ENGINE
    </div>

    <button
      id="goLoginButton"
      class="main-button"
      type="button">
      Login
    </button>

    <div class="footer">
      © KEYZO
    </div>

  </section>


  <!-- =========================
       LOGIN PAGE
  ========================== -->

  <section
    id="loginPage"
    class="page hidden">

    <div class="login-card">

      <h1 class="login-title">
        KEYZO
      </h1>

      <div class="login-subtitle">
        Use Key🔑
      </div>

      <input
        id="username"
        class="input"
        type="text"
        placeholder="Username"
        autocomplete="username"
      >

      <input
        id="password"
        class="input"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button
        id="loginButton"
        class="login-button"
        type="button">
        Login
      </button>

      <div
        id="loginMessage"
        class="message">
      </div>

      <button
        id="backButton"
        class="back-button"
        type="button">
        ← Kembali
      </button>

    </div>

  </section>


  <!-- =========================
       DASHBOARD PAGE
  ========================== -->

  <section
    id="dashboardPage"
    class="page hidden">

    <div class="dashboard-card">

      <h1 class="dashboard-title">
        KEYZO
      </h1>

      <div class="welcome">
        WELCOME TO KEYZO
      </div>

      <div class="dashboard-text">
        Anda berhasil masuk ke KEYZO.
      </div>

      <div class="profile-box">
        User:
        <strong id="welcomeUser">
          keyzo
        </strong>
      </div>

      <button
        id="logoutButton"
        class="logout-button"
        type="button">
        Logout
      </button>

    </div>

  </section>


  <script>

    /* =========================
       KONFIGURASI LOGIN
    ========================== */

    const VALID_USERNAME = "keyzo";
    const VALID_PASSWORD = "keyzo864";


    /* =========================
       ELEMENT
    ========================== */

    const splashPage =
      document.getElementById("splashPage");

    const loginPage =
      document.getElementById("loginPage");

    const dashboardPage =
      document.getElementById("dashboardPage");

    const goLoginButton =
      document.getElementById("goLoginButton");

    const backButton =
      document.getElementById("backButton");

    const loginButton =
      document.getElementById("loginButton");

    const logoutButton =
      document.getElementById("logoutButton");

    const usernameInput =
      document.getElementById("username");

    const passwordInput =
      document.getElementById("password");

    const loginMessage =
      document.getElementById("loginMessage");

    const welcomeUser =
      document.getElementById("welcomeUser");


    /* =========================
       TAMPILKAN SPLASH
    ========================== */

    function showSplash() {

      splashPage.classList.remove("hidden");

      loginPage.classList.add("hidden");

      dashboardPage.classList.add("hidden");

    }


    /* =========================
       TAMPILKAN LOGIN
    ========================== */

    function showLogin() {

      splashPage.classList.add("hidden");

      loginPage.classList.remove("hidden");

      dashboardPage.classList.add("hidden");

      loginMessage.textContent = "";

      usernameInput.value = "";

      passwordInput.value = "";

      setTimeout(() => {
        usernameInput.focus();
      }, 100);

    }


    /* =========================
       TAMPILKAN DASHBOARD
    ========================== */

    function showDashboard(username) {

      splashPage.classList.add("hidden");

      loginPage.classList.add("hidden");

      dashboardPage.classList.remove("hidden");

      welcomeUser.textContent = username;

    }


    /* =========================
       LOGIN
    ========================== */

    function login() {

      const username =
        usernameInput.value.trim();

      const password =
        passwordInput.value;


      if (!username || !password) {

        loginMessage.textContent =
          "Username dan password wajib diisi.";

        return;
      }


      loginButton.disabled = true;

      loginButton.textContent =
        "Memproses...";


      setTimeout(() => {

        if (
          username === VALID_USERNAME &&
          password === VALID_PASSWORD
        ) {

          sessionStorage.setItem(
            "KEYZO_user",
            username
          );

          loginMessage.textContent = "";

          showDashboard(username);

        } else {

          loginMessage.textContent =
            "Username atau password salah.";

          passwordInput.value = "";

          passwordInput.focus();

        }


        loginButton.disabled = false;

        loginButton.textContent =
          "Login";

      }, 350);

    }


    /* =========================
       LOGOUT
    ========================== */

    function logout() {

      sessionStorage.removeItem(
        "KEYZO_user"
      );

      showLogin();

    }


    /* =========================
       EVENT
    ========================== */

    goLoginButton.addEventListener(
      "click",
      showLogin
    );

    backButton.addEventListener(
      "click",
      showSplash
    );

    loginButton.addEventListener(
      "click",
      login
    );

    logoutButton.addEventListener(
      "click",
      logout
    );


    usernameInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          login();
        }

      }
    );


    passwordInput.addEventListener(
      "keydown",
      function(event) {

        if (event.key === "Enter") {
          login();
        }

      }
    );


    /* =========================
       CEK SESSION
    ========================== */

    const savedUser =
      sessionStorage.getItem(
        "KEYZO_user"
      );


    if (savedUser) {

      showDashboard(savedUser);

    } else {

      showSplash();

    }

  </script>

</body>
</html>
