<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIBoss</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #0f172a;
      color: white;
    }

    .container {
      width: 92%;
      max-width: 1100px;
      margin: 50px auto;
    }

    .card {
      background: #1e293b;
      border-radius: 24px;
      padding: 35px;
      box-shadow: 0 15px 40px rgba(0,0,0,.25);
    }

    h1 {
      margin-top: 0;
      font-size: 42px;
    }

    h2 {
      margin-top: 0;
    }

    .hidden {
      display: none !important;
    }

    input {
      width: 100%;
      padding: 18px;
      margin: 10px 0;
      border: 0;
      border-radius: 14px;
      background: #3b465c;
      color: white;
      font-size: 18px;
      outline: none;
    }

    button {
      width: 100%;
      padding: 18px;
      margin-top: 15px;
      border: 0;
      border-radius: 14px;
      background: #6366f1;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4f46e5;
    }

    .message {
      margin-top: 20px;
      text-align: center;
      font-size: 18px;
    }

    .dashboard-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      gap: 20px;
      margin-bottom: 30px;
    }

    .logout {
      width: auto;
      min-width: 130px;
      margin: 0;
    }

    .welcome {
      font-size: 20px;
      color: #cbd5e1;
      margin-bottom: 30px;
    }

    .grid {
      display: grid;
      grid-template-columns: repeat(3, 1fr);
      gap: 20px;
    }

    .menu-card {
      background: #273449;
      border-radius: 18px;
      padding: 25px;
      min-height: 150px;
    }

    .menu-card h3 {
      margin-top: 0;
      font-size: 22px;
    }

    .menu-card p {
      color: #cbd5e1;
      line-height: 1.5;
    }

    @media (max-width: 700px) {
      .container {
        margin: 25px auto;
      }

      .card {
        padding: 25px;
      }

      .dashboard-header {
        flex-direction: column;
        align-items: stretch;
      }

      .logout {
        width: 100%;
      }

      .grid {
        grid-template-columns: 1fr;
      }

      h1 {
        font-size: 34px;
      }
    }
  </style>
</head>

<body>

  <div class="container">

    <!-- LOGIN -->
    <div id="loginPage" class="card">
      <h1>KIBoss Login</h1>

      <input
        id="username"
        type="text"
        placeholder="Username"
        autocomplete="username"
      >

      <input
        id="password"
        type="password"
        placeholder="Password"
        autocomplete="current-password"
      >

      <button id="loginButton">Login</button>

      <div id="loginMessage" class="message"></div>
    </div>


    <!-- DASHBOARD -->
    <div id="dashboardPage" class="card hidden">

      <div class="dashboard-header">
        <div>
          <h1>Dashboard</h1>
          <div id="welcomeText" class="welcome"></div>
        </div>

        <button id="logoutButton" class="logout">
          Logout
        </button>
      </div>

      <div class="grid">

        <div class="menu-card">
          <h3>📊 Overview</h3>
          <p>
            Ringkasan aktivitas KIBoss akan ditampilkan di sini.
          </p>
        </div>

        <div class="menu-card">
          <h3>👤 Account</h3>
          <p>
            Informasi akun pengguna yang sedang login.
          </p>
        </div>

        <div class="menu-card">
          <h3>⚙️ Settings</h3>
          <p>
            Pengaturan aplikasi KIBoss.
          </p>
        </div>

      </div>

    </div>

  </div>

  <script src="index.js"></script>

</body>
</html>
