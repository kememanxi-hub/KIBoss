<!DOCTYPE html>
<html lang="id">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>KIBoss</title>

  <style>
    * {
      box-sizing: border-box;
      font-family: Arial, sans-serif;
    }

    body {
      margin: 0;
      min-height: 100vh;
      display: flex;
      justify-content: center;
      align-items: center;
      background: #111827;
      color: white;
      padding: 20px;
    }

    .box {
      width: 100%;
      max-width: 500px;
      padding: 35px;
      background: #1f2937;
      border-radius: 18px;
      box-shadow: 0 10px 30px rgba(0,0,0,.3);
    }

    h1 {
      text-align: center;
      margin: 0 0 30px;
      font-size: 38px;
    }

    input {
      width: 100%;
      padding: 16px;
      margin-bottom: 15px;
      border: none;
      border-radius: 10px;
      background: #374151;
      color: white;
      font-size: 17px;
      outline: none;
    }

    input::placeholder {
      color: #9ca3af;
    }

    button {
      width: 100%;
      padding: 16px;
      border: none;
      border-radius: 10px;
      background: #6366f1;
      color: white;
      font-size: 18px;
      font-weight: bold;
      cursor: pointer;
    }

    button:hover {
      background: #4f46e5;
    }

    #message {
      text-align: center;
      margin-top: 20px;
      font-size: 17px;
    }

    .dashboard-text {
      text-align: center;
      font-size: 20px;
      margin-bottom: 30px;
    }

    .hidden {
      display: none;
    }
  </style>
</head>

<body>

  <!-- LOGIN -->
  <div id="loginPage" class="box">
    <h1>KIBoss Login</h1>

    <form id="loginForm">
      <input
        type="text"
        id="username"
        placeholder="Username"
        autocomplete="username"
        required
      >

      <input
        type="password"
        id="password"
        placeholder="Password"
        autocomplete="current-password"
        required
      >

      <button type="submit">Login</button>
    </form>

    <div id="message"></div>
  </div>


  <!-- DASHBOARD -->
  <div id="dashboardPage" class="box hidden">
    <h1>Dashboard</h1>

    <div class="dashboard-text">
      Selamat datang, <strong id="dashboardUsername"></strong>!
      <br><br>
      Anda berhasil masuk ke KIBoss.
    </div>

    <button id="logoutButton">Logout</button>
  </div>


  <script>
    const loginPage = document.getElementById("loginPage");
    const dashboardPage = document.getElementById("dashboardPage");

    const loginForm = document.getElementById("loginForm");
    const usernameInput = document.getElementById("username");
    const passwordInput = document.getElementById("password");

    const message = document.getElementById("message");
    const dashboardUsername =
      document.getElementById("dashboardUsername");

    const logoutButton =
      document.getElementById("logoutButton");


    // =========================
    // CEK SESSION
    // =========================

    function showDashboard(username) {
      loginPage.classList.add("hidden");
      dashboardPage.classList.remove("hidden");

      dashboardUsername.textContent = username;
    }


    function showLogin() {
      dashboardPage.classList.add("hidden");
      loginPage.classList.remove("hidden");

      usernameInput.value = "";
      passwordInput.value = "";
      message.textContent = "";
    }


    // =========================
    // LOGIN
    // =========================

    loginForm.addEventListener("submit", async function(event) {
      event.preventDefault();

      const username = usernameInput.value.trim();
      const password = passwordInput.value;

      message.textContent = "Memproses...";

      try {
        const response = await fetch("/api/login", {
          method: "POST",
          headers: {
            "Content-Type": "application/json"
          },
          body: JSON.stringify({
            username: username,
            password: password
          })
        });

        const data = await response.json();

        if (data.success) {
          localStorage.setItem(
            "kiboss_user",
            data.user.username
          );

          showDashboard(data.user.username);
        } else {
          message.textContent =
            data.message || "Login gagal";
        }

      } catch (error) {
        console.error(error);

        message.textContent =
          "Terjadi kesalahan koneksi";
      }
    });


    // =========================
    // LOGOUT
    // =========================

    logoutButton.addEventListener("click", function() {
      localStorage.removeItem("kiboss_user");

      showLogin();
    });


    // =========================
    // RESTORE SESSION
    // =========================

    const savedUser =
      localStorage.getItem("kiboss_user");

    if (savedUser) {
      showDashboard(savedUser);
    } else {
      showLogin();
    }
  </script>

</body>
</html>
