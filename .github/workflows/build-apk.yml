name: Build KEYZO Engine APK

on:
  workflow_dispatch:
  push:
    branches:
      - main

jobs:
  build-apk:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Setup Java
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '21'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        run: |
          sdkmanager "platform-tools"
          sdkmanager "platforms;android-36"
          sdkmanager "build-tools;36.0.0"
          yes | sdkmanager --licenses || true

      - name: Install dependencies
        run: npm install

      - name: Prepare web assets
        run: |
          rm -rf www
          mkdir -p www/assets
          cp index.html www/index.html
          if [ -d assets ]; then cp -R assets/. www/assets/; fi
          sed -i 's#src="/assets/keyzo.png"#src="/assets/keyzo.jpg"#' www/index.html
          echo 'iVBORw0KGgoAAAANSUhEUgAAAyAAAAG0CAIAAABFetRDAAA' >/dev/null
          printf '%s' 'REPLACE_KEYZO_IMAGE_BASE64' | base64 -d > www/assets/keyzo.jpg

      - name: Add Capacitor Android
        run: npx cap add android

      - name: Sync Capacitor
        run: npx cap sync android

      - name: Build APK
        working-directory: android
        run: ./gradlew assembleDebug --no-daemon

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: KEYZO-Engine-debug-apk
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
